[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-skew-attribution-lab"
version = "1.0.0"
description = "Three-way training-serving feature skew attributor breaking parity symmetry with a reference oracle"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sai Hanwith Bellamkonda", email = "saihanwith.b@mycvcareer.com"}
]
dependencies = []

[project.scripts]
skew-attr = "feature_skew_attribution_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
